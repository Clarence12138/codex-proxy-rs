name: CI

on:
  push:
    branches:
      - main
      - custom
  pull_request:
    branches:
      - main
      - custom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: >-
        ${{ github.repository == 'Clarence12138/codex-proxy-rs' &&
            github.ref == 'refs/heads/custom' &&
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            (github.event_name == 'workflow_dispatch' || steps.filter.outputs.container == 'true') }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect affected checks
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # push 比较本分支推送前后的差异，不能默认与 main 比较全部二开改动。
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'release/version.yaml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            container:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - '.dockerignore'
              - 'release/version.yaml'
              - '.github/actions/**'
              - '.github/workflows/_container.yml'
              - '.github/workflows/_quality.yml'
              - '.github/workflows/ci.yml'

  quality:
    needs: changes
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      run_backend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.publish == 'true' || needs.changes.outputs.backend == 'true' }}
      run_frontend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.publish == 'true' || needs.changes.outputs.frontend == 'true' }}

  container:
    needs: [changes, quality]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.container == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/_container.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      publish: ${{ needs.changes.outputs.publish == 'true' }}
